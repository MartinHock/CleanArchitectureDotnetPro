name: Test Templates

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-template:
    name: ${{ matrix.client-framework }}-${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        client-framework: [angular, react, none]
        database: [sqlite, sqlserver, postgresql]

    steps:
    - uses: actions/checkout@v6
      name: Checkout code

    - name: Install .NET
      uses: actions/setup-dotnet@v5

    - name: Install Node & cache npm packages
      if: matrix.client-framework != 'none'
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: |
          src/Web/ClientApp/package-lock.json
          src/Web/ClientApp-React/package-lock.json

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ matrix.client-framework }}-${{ matrix.database }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install template
      run: dotnet new install .

    - name: Generate solution
      run: |
        dotnet new ca-sln \
          --client-framework ${{ matrix.client-framework }} \
          --database ${{ matrix.database }} \
          --name CleanArchitecture \
          --output generated \
          --no-update-check

    - name: Build solution
      working-directory: generated
      run: dotnet build --configuration Release

    - name: Build client app
      if: matrix.client-framework != 'none'
      working-directory: generated
      shell: pwsh
      run: |
        $clientAppCandidates = @(
          'src/Web/ClientApp',
          'src/Web/ClientApp-React'
        )

        $clientAppPath = $clientAppCandidates |
          Where-Object { Test-Path (Join-Path (Get-Location) $_) } |
          Select-Object -First 1

        if (-not $clientAppPath) {
          throw "No client app directory was found under generated/src/Web."
        }

        Push-Location $clientAppPath
        try {
          npm ci
          npm run build
        }
        finally {
          Pop-Location
        }

    - name: Build acceptance tests
      if: matrix.client-framework != 'none'
      working-directory: generated
      run: dotnet build tests/Web.AcceptanceTests/Web.AcceptanceTests.csproj --configuration Release

    - name: Install Playwright browsers
      if: matrix.client-framework != 'none'
      working-directory: generated
      shell: pwsh
      run: |
        $playwrightScript = Get-ChildItem -Path . -Recurse -Filter playwright.ps1 |
          Where-Object { $_.FullName -like '*Web.AcceptanceTests*' } |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $playwrightScript) {
          throw "playwright.ps1 was not found under the generated solution after build."
        }

        & $playwrightScript install --with-deps chromium

    - name: Diagnose acceptance test paths
      if: ${{ failure() && matrix.client-framework != 'none' }}
      working-directory: generated
      shell: pwsh
      run: |
        Write-Host 'Client app directories:'
        Get-ChildItem -Path src/Web -Directory -ErrorAction SilentlyContinue |
          Select-Object FullName

        Write-Host 'Acceptance test projects:'
        Get-ChildItem -Path tests -Recurse -Filter *.csproj |
          Where-Object { $_.FullName -like '*AcceptanceTests*' } |
          Select-Object FullName

        Write-Host 'Playwright scripts:'
        Get-ChildItem -Path . -Recurse -Filter playwright.ps1 |
          Select-Object FullName

        Write-Host 'Acceptance test output directories:'
        Get-ChildItem -Path artifacts -Recurse -Directory |
          Where-Object { $_.FullName -like '*AcceptanceTests*' -or $_.FullName -like '*Web.AcceptanceTests*' } |
          Select-Object FullName

    

    - name: Test non-acceptance projects
      working-directory: generated
      shell: pwsh
      run: |
        $testProjects = Get-ChildItem -Path tests -Recurse -Filter *.csproj |
          Where-Object { $_.Name -ne 'Web.AcceptanceTests.csproj' }

        foreach ($project in $testProjects) {
          dotnet test $project.FullName --no-build --configuration Release
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Test acceptance tests
      if: matrix.client-framework != 'none'
      working-directory: generated
      run: dotnet test tests/Web.AcceptanceTests/Web.AcceptanceTests.csproj --no-build --configuration Release
