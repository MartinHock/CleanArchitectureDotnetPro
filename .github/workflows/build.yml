name: Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.scripts/**'
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE
      - README.md
  workflow_dispatch:
  workflow_call:
    inputs:
      build-artifacts:
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      name: Checkout code

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    #if (!UseApiOnly)
    - name: Install Node & cache npm packages
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: |
          src/Web/ClientApp/package-lock.json
          src/Web/ClientApp-React/package-lock.json
    #endif

    - name: Install .NET
      uses: actions/setup-dotnet@v5

    - name: Restore solution
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    #if (!UseApiOnly)
    - name: Install Playwright browsers
      shell: pwsh
      run: |
        if (-not (Test-Path 'tests/Web.AcceptanceTests/Web.AcceptanceTests.csproj')) {
          Write-Host 'Web.AcceptanceTests project not present. Skipping browser install.'
          exit 0
        }

        $playwrightScript = 'artifacts/bin/Web.AcceptanceTests/release/playwright.ps1'

        if (-not (Test-Path $playwrightScript)) {
          throw "Expected Playwright script was not generated at '$playwrightScript'."
        }

        & $playwrightScript install --with-deps chromium
    #endif

    - name: Test solution
      run: dotnet test --no-build --configuration Release
